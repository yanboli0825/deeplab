# @package _global_
defaults:
  - override /hydra/sweeper: optuna
#  - override /hydra/sweeper/sampler: tpe

hydra:
  sweeper:
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: ${seed}
    direction: minimize
    study_name: hparams_optimization
    storage: null
    n_trials: 2       # 搜参组数
    n_jobs: 1         # 并行度
    params:
      # 定义搜索空间，直接覆盖 model 和 datamodule 中的参数
      model.init_args.optimizer.lr: interval(1e-4, 1e-2)
#      model.weight_decay: choice(1e-4, 1e-5, 0.0)
#      data.batch_size: choice(16, 32, 64)