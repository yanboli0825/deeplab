_target_: src.models.cpath.dsmil.DSMIL
_recursive_: false

init_args:
  model_cfg:
    model_name: dsmil
    in_size: 2048
    num_classes: 2
    q_dim: 128
    dropout_v: 0.0
    nonlinear: True
    passing_v: False
  optimizer:
    _target_: torch.optim.AdamW
    lr: 1e-4
    weight_decay: 1e-4
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: ${trainer.init_args.max_epochs}
    eta_min: 1e-6